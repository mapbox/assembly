name: NPM release

on:
  push:
    tags:
      - '*'

env:
  CI: true

jobs:
  publish:
    name: "Publish ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract package version from package.json
        run: |
          packageVersion=$(jq -r .version package.json)
          echo "versionTag=v$packageVersion" >> "$GITHUB_ENV"

      - name: Verify tag matches package.json version
        if: ${{ github.ref_name != env.versionTag }}
        run: |
          echo "Tag ${{ github.ref_name }} does not match package.json version (expected ${{ env.versionTag }})."
          exit 1

      - name: Enforce publisher-production branch for production releases
        # Dev releases (.dev/-dev) are exempt - they're meant for testing from
        # any branch before a real release is cut from publisher-production.
        if: ${{ !contains(github.ref_name, '.dev') && !contains(github.ref_name, '-dev') }}
        run: |
          git fetch origin publisher-production --depth=1
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/publisher-production; then
            echo "Production releases must be tagged from a commit on publisher-production."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # assembly is a public repo, so it can't use mapbox/gha (internal-visibility) -
      # not needed anyway, since assembly's only @mapbox/* deps (batfish,
      # eslint-config-mapbox) are public npm packages resolved straight from npmjs.
      - name: Install npm dependencies
        run: npm ci --no-fund --no-audit --prefer-offline

      - name: Build
        run: npm run build --if-present

      - name: Release production
        if: ${{ !contains(github.ref_name, '.dev') && !contains(github.ref_name, '-dev') }}
        run: npm publish

      - name: Release development
        if: ${{ contains(github.ref_name, '.dev') || contains(github.ref_name, '-dev') }}
        run: npm publish --tag dev
