name: NPM release

# Every push to main:
#   - publishes a new npm version when commits warrant one (Conventional Commits), uploads its
#     assets to the CDN (api.mapbox.com/mapbox-assembly/v<version>/), and creates a GitHub release;
#   - builds the docs site against the current version and deploys it to labs staging and
#     production (https://labs.mapbox.com/assembly/), including docs-only changes.
# A manual run on another branch publishes a `<version>-<sha>` prerelease and stages the docs
# site on labs staging only.
on:
  push:
    branches: ['main']
  workflow_dispatch: {}

concurrency:
  group: npm-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CI: true
  bucket: '{ "staging": "labs.mapbox.com-staging/assembly", "production": "labs.mapbox.com/assembly" }'

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  publish:
    name: 'Publish ${{ github.ref_name }}'
    runs-on: ubuntu-latest
    # npm's Trusted Publisher config for @mapbox/assembly is bound to this workflow file and environment.
    environment: npm-release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Upgrade npm for OIDC trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Install npm dependencies
        run: npm ci --no-fund --no-audit --prefer-offline

      # Runs stylelint, eslint, icon and jest tests, and builds dist/
      - name: Lint, test, and build
        run: npm test

      # Reads the current version from public npmjs and git history
      - id: version
        uses: mapbox/gha@action-conventional-commit-version-v0
        with:
          before-sha: ${{ github.event.before }}
          after-sha: ${{ github.event.after }}

      # The docs site links to the CDN assets by package.json's version, which CI never commits
      # back, so set it to the version being released (or the latest published one) first.
      - id: site-version
        name: Set package version
        env:
          SKIP: ${{ steps.version.outputs.skip }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$SKIP" = "true" ]; then
            VERSION="$(npm view @mapbox/assembly version)"
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build docs site
        run: npm run build:site

      - name: Publish
        if: steps.version.outputs.skip != 'true'
        run: npm publish --tag ${{ steps.version.outputs.npm_publish_tag }}

      - name: Configure AWS credentials
        uses: mapbox/gha@action-configure-aws-credentials-v5
        with:
          target-account-id: ${{ vars.AWS_ACCOUNT_ID_DEFAULT }}
          role-to-assume: assembly-s3

      - name: Upload assets to the CDN
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.site-version.outputs.version }}
        run: >-
          aws s3 cp dist "s3://mapbox-assembly/v$VERSION" --recursive
          --exclude "*" --include "assembly*" --acl public-read

      - name: Deploy docs site to staging
        run: |
          aws s3 sync _site "s3://${{ fromJson(env.bucket).staging }}" --exclude "*.html" --cache-control "max-age=120"
          aws s3 sync _site "s3://${{ fromJson(env.bucket).staging }}" --exclude "*" --include "*.html" --cache-control "max-age=0"

      - name: Deploy docs site to production
        if: github.ref_name == 'main'
        run: |
          aws s3 sync _site "s3://${{ fromJson(env.bucket).production }}" --exclude "*.html" --cache-control "max-age=120"
          aws s3 sync _site "s3://${{ fromJson(env.bucket).production }}" --exclude "*" --include "*.html" --cache-control "max-age=0"

      - id: release
        name: Create GitHub Release
        continue-on-error: true
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.npm_publish_tag == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes

      - name: Comment released version on PRs
        continue-on-error: true
        if: steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -o pipefail
          package_name="$(node -p 'require("./package.json").name')"
          for sha in $(git rev-list "$BEFORE_SHA..$GITHUB_SHA"); do
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[].number'
          done | sort -u | while read -r pr; do
            gh pr comment "$pr" --body "Released in \`$package_name@$VERSION\` (release [\`v$VERSION\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION))."
          done
